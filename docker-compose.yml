name: atmos

services:
  backend:
    build:
      context: .
      dockerfile: src/backend/Atmos.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      WeatherApi__ApiKey: ${WEATHER_API_KEY:?Set WEATHER_API_KEY in .env}
      MEDIATR_LICENSE_KEY: ${MEDIATR_LICENSE_KEY:-}
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - atmos-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: src/frontend/atmos-web/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${ATMOS_PORT:-8088}:8080"
    restart: unless-stopped
    networks:
      - atmos-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

networks:
  atmos-network:
    driver: bridge
