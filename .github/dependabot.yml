version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      dotnet-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /src/frontend/atmos-web
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/backend/Atmos.Api
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /src/frontend/atmos-web
    schedule:
      interval: weekly
